name: BiteCast Keys scan

# Runs in the cloud on a schedule — your PC can be off.
on:
  schedule:
    # times are UTC. ~6am, 12pm, 6pm Eastern (EDT). Adjust as you like.
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      mode:
        description: "scan = full analysis · ping = just prove the phone gets a message"
        type: choice
        default: scan
        options: [scan, ping]

permissions:
  contents: write          # so it can commit the result files back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # v5+ runs on Node 24 (Node 20 left the runners 2026-09-23)

      - uses: actions/setup-python@v6      # v6+ runs on Node 24
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # A green run means "the phone got the report". If the push fails, the
      # analyzer exits 2 and this step (and the run) shows RED on the Actions tab.
      - name: Run analyzer
        id: analyzer
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # set this in repo Settings → Secrets and variables → Actions
          BITECAST_MODE: ${{ inputs.mode || 'scan' }}
        run: python analyze.py

      # Runs even when the push failed, so the map data still lands in the repo.
      # Pulls first: if a file was uploaded to the repo while the scan ran, a plain push
      # would be rejected and the fresh results silently lost.
      - name: Publish result files
        if: ${{ always() && steps.analyzer.outcome != 'skipped' }}
        run: |
          git config user.name  "bitecast-bot"
          git config user.email "bot@users.noreply.github.com"
          added=0
          for f in hotspots.geojson structure.geojson satgrid.json; do
            if [ -f "$f" ]; then git add "$f" && added=1; fi
          done
          if [ "$added" = "1" ] && ! git diff --cached --quiet; then
            git commit -m "update scan results $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || echo "rebase skipped"
            git push || echo "push failed — results not published this run"
          else
            echo "no result changes to publish"
          fi
